<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Bağlantısı</title><style>body{margin:0;background:#15110d;color:#efe7d6;font:17px/1.6 Georgia,serif;padding:32px 16px}main{max-width:720px;margin:auto}h1,h2{font-weight:400}a{color:#f2c14e}code{display:block;word-break:break-all;background:#2a221a;padding:12px;border-radius:6px;font-size:14px}button{margin-top:12px;font:16px Georgia,serif;padding:10px 18px;background:#f2c14e;border:0;border-radius:6px}</style></head><body><main>
<h1>TikTok bağlantısı</h1><p id="d">Bu adresin tamamını kopyalayıp Claude'a gönderin.</p>
<code id="u"></code><button onclick="navigator.clipboard.writeText(location.href).then(()=>{this.textContent='Kopyalandı ✓'})">Adresi kopyala</button>
<script>document.getElementById('u').textContent=location.href;if(!location.search.includes('code='))document.getElementById('d').textContent='Kod yok: izin verilmedi ya da sayfa doğrudan açıldı.'</script>
</main></body></html>
